# --- Conexão com o MySQL ---
# createDatabaseIfNotExist=true cria o banco "tecsys_gateway" automaticamente
# na primeira conexao, caso ele ainda nao exista.
spring.datasource.url=jdbc:mysql://localhost:3306/tecsys_gateway?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=America/Sao_Paulo
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- Hibernate / JPA ---
# "update": cria/ajusta as tabelas automaticamente a partir das classes @Entity,
# sem apagar dados ja existentes. Nao usar em producao (la, prefira "validate"
# + migrations versionadas, ex. Flyway), mas e o ideal para desenvolvimento.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- Servidor ---
server.port=8080

# --- Logs (opcional, ajuda a debugar as requisicoes vindas do Flutter) ---
logging.level.org.springframework.web=INFO
logging.level.com.tecsys.gatewayplanner=DEBUG

# --- Relevo (arquivos SRTM .hgt) ---
# Pasta com os .hgt. Se ficar vazio, o backend procura sozinho em:
#   ./terrain (backend/terrain)  ->  ../frontend/terrain  ->  ../terrain  ->  varredura do projeto
# (o log ao subir mostra qual pasta foi usada). Também vale a variável de ambiente TERRAIN_DIR.
gridsight.terrain.dir=${TERRAIN_DIR:}

# Download automático: ao calcular com relevo, o backend baixa sozinho os ladrilhos SRTM que faltarem
# (cópia pública na AWS, sem login) e guarda na pasta acima (padrão backend/terrain). Precisa de internet
# no computador do backend, só na primeira vez de cada região.
gridsight.terrain.auto-download=true
# false = versão leve (~90 m, ~2,8 MB por ladrilho); true = original (~30 m, ~25 MB por ladrilho)
gridsight.terrain.full-resolution=false
# true = ao subir, baixa em segundo plano o relevo de TODAS as regiões do banco (centenas de ladrilhos, vários GB).
# Deixe false: o relevo é baixado só da região que você escolher ao otimizar.
gridsight.terrain.warmup=false
# Quanto o cálculo espera pelo download antes de seguir (o que não terminar continua em segundo plano;
# links sem relevo ainda usam só a distância e o app avisa)
gridsight.terrain.max-wait-seconds=25

# Margem de segurança padrão do enlace, em dB (obstáculos que o relevo não mostra).
# 0 = só bloqueia o que o modelo (equivalente ao Longley-Rice do Radio Mobile) diz que NÃO chega.
# O app permite mudar em Parâmetros; aumente para um plano mais conservador.
gridsight.rf.fade-margin-db=0

# --- Erros legíveis no app ---
server.error.include-message=always

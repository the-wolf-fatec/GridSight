# --- Conexão com o MySQL ---
# createDatabaseIfNotExist=true cria o banco "tecsys_gateway" automaticamente
# na primeira conexao, caso ele ainda nao exista.
spring.datasource.url=jdbc:mysql://localhost:3306/tecsys_gateway?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=America/Sao_Paulo
spring.datasource.username=root
spring.datasource.password=carlos13
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- Hibernate / JPA ---
# "update": cria/ajusta as tabelas automaticamente a partir das classes @Entity,
# sem apagar dados ja existentes. Nao usar em producao (la, prefira "validate"
# + migrations versionadas, ex. Flyway), mas e o ideal para desenvolvimento.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- Servidor ---
server.port=8080

# --- Logs (opcional, ajuda a debugar as requisicoes vindas do Flutter) ---
logging.level.org.springframework.web=INFO
logging.level.com.tecsys.gatewayplanner=DEBUG
# --- Relevo (arquivos SRTM .hgt) ---
# Pasta com os .hgt. Se ficar vazio, o backend procura sozinho em:
#   ./terrain (backend/terrain)  ->  ../frontend/terrain  ->  ../terrain  ->  varredura do projeto
# (o log ao subir mostra qual pasta foi usada). Também vale a variável de ambiente TERRAIN_DIR.
gridsight.terrain.dir=${TERRAIN_DIR:}

# Margem de segurança padrão do enlace, em dB (árvores/prédios que o relevo não mostra).
# 0 = só bloqueia o que o modelo (equivalente ao Longley-Rice do Radio Mobile) diz que NÃO chega.
# O app permite mudar em Parâmetros; aumente para um plano mais conservador.
gridsight.rf.fade-margin-db=0

# --- Erros legíveis no app ---
server.error.include-message=always

# --- Árvores e prédios (OpenStreetMap via Overpass) ---
# Os dados são baixados na primeira vez e guardados nesta pasta (depois funciona sem internet).
gridsight.clutter.dir=${CLUTTER_DIR:./clutter}
gridsight.clutter.overpass-url=https://overpass-api.de/api/interpreter

# --- ConexÃ£o com o MySQL ---
# createDatabaseIfNotExist=true cria o banco "tecsys_gateway" automaticamente
# na primeira conexao, caso ele ainda nao exista.
spring.datasource.url=jdbc:mysql://localhost:3306/tecsys_gateway?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=America/Sao_Paulo
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- Hibernate / JPA ---
# "update": cria/ajusta as tabelas automaticamente a partir das classes @Entity,
# sem apagar dados ja existentes. Nao usar em producao (la, prefira "validate"
# + migrations versionadas, ex. Flyway), mas e o ideal para desenvolvimento.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- Servidor ---
server.port=8080

# --- Logs (opcional, ajuda a debugar as requisicoes vindas do Flutter) ---
logging.level.org.springframework.web=INFO
logging.level.com.tecsys.gatewayplanner=DEBUG
# --- Relevo (arquivos SRTM .hgt) ---
# Pasta com os .hgt. Se ficar vazio, o backend procura sozinho em:
#   ./terrain (backend/terrain)  ->  ../frontend/terrain  ->  ../terrain  ->  varredura do projeto
# (o log ao subir mostra qual pasta foi usada). TambÃ©m vale a variÃ¡vel de ambiente TERRAIN_DIR.
gridsight.terrain.dir=${TERRAIN_DIR:}

# Margem de seguranÃ§a padrÃ£o do enlace, em dB (Ã¡rvores/prÃ©dios que o relevo nÃ£o mostra).
# 0 = sÃ³ bloqueia o que o modelo (equivalente ao Longley-Rice do Radio Mobile) diz que NÃƒO chega.
# O app permite mudar em ParÃ¢metros; aumente para um plano mais conservador.
gridsight.rf.fade-margin-db=0

# --- Erros legÃ­veis no app ---
server.error.include-message=always
